<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Danial Conversion</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #ffffff;
    padding: 32px 28px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    width: 320px;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
    color: #222;
  }
  p.subtitle {
    font-size: 13px;
    color: #777;
    margin-top: 0;
    margin-bottom: 20px;
  }
  label {
    display: block;
    text-align: left;
    font-size: 14px;
    color: #444;
    margin-bottom: 6px;
  }
  input[type="number"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    background: #2d6cdf;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover {
    background: #2557b8;
  }
  .result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #222;
    min-height: 24px;
  }
  .error {
    color: #cc3333;
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 10px;
    text-align: left;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Danial Conversion</h1>
    <p class="subtitle">Convert millimeters to centimeters</p>

    <label for="mmInput">Value in millimeters (mm)</label>
    <input type="number" id="mmInput" placeholder="Enter value in mm" step="any">
    <div class="error" id="errorMsg">Please enter a valid number.</div>

    <button onclick="convert()">Convert</button>

    <div class="result" id="resultText"></div>
  </div>

<script>
  function convert() {
    const input = document.getElementById('mmInput');
    const errorMsg = document.getElementById('errorMsg');
    const resultText = document.getElementById('resultText');
    const value = parseFloat(input.value);

    if (input.value.trim() === '' || isNaN(value)) {
      errorMsg.style.display = 'block';
      resultText.textContent = '';
      return;
    }

    errorMsg.style.display = 'none';
    const cm = value / 10;
    resultText.textContent = value + ' mm = ' + cm + ' cm';
  }

  document.getElementById('mmInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') convert();
  });
</script>
</body>
</html>
